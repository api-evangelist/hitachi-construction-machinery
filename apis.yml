aid: hitachi-construction-machinery

name: Hitachi Construction Machinery

description: >-
  Hitachi Construction Machinery provides operational data about machines and
  equipment on construction sites through the Telematics API, which complies
  with the ISO 15143-3 (AEMP 2.0) standard. The API enables higher efficiency,
  productivity, and safety while reducing life cycle costs. API access, data elements
  and supported regions are arranged through Hitachi dealers; no public API reference
  or machine-readable contract is published.

